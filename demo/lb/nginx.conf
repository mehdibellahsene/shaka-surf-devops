# Démo locale — configuration du load balancer Nginx.
# Miroir du rôle Ansible "loadbalancer" : terminaison TLS + round-robin sur
# les VMs applicatives. En prod le certificat vient de Let's Encrypt ; ici
# il est auto-signé (CN=localhost), généré au démarrage par entrypoint.sh.

upstream shaka_app {
    # Round-robin (comportement Nginx par défaut) sur les deux "VMs" app.
    server app1-web:80;
    server app2-web:80;
}

server {
    listen 80;
    server_name localhost;

    # Tout le trafic HTTP est redirigé vers HTTPS (8443 = port publié côté hôte).
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
        proxy_pass http://shaka_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}
