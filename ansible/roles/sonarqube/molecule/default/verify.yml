---
- name: Verify
  hosts: all
  become: true
  vars:
    sonarqube_dir: "/opt/sonarqube"
  tasks:
    - name: vm.max_map_count est relevé pour Elasticsearch
      ansible.builtin.command: sysctl -n vm.max_map_count
      register: vmm
      changed_when: false
      failed_when: vmm.stdout | int < 262144

    - name: Le docker-compose SonarQube a été rendu
      ansible.builtin.stat:
        path: "{{ sonarqube_dir }}/docker-compose.yml"
      register: compose
      failed_when: not compose.stat.exists

    - name: Le vhost SonarQube expose le bon port amont
      ansible.builtin.command: grep -q '127.0.0.1:9000' /etc/nginx/sites-available/sonar.conf
      changed_when: false

    - name: Nginx est actif (reverse-proxy)
      ansible.builtin.service:
        name: nginx
        state: started
      check_mode: true
      register: ng
      failed_when: ng is failed

    - name: Le port 80 (vhost Nginx) répond
      ansible.builtin.wait_for:
        port: 80
        host: 127.0.0.1
        timeout: 10
