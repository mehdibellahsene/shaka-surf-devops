---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml
driver:
  name: docker
platforms:
  - name: sonar-instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: /usr/sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
provisioner:
  name: ansible
  inventory:
    host_vars:
      sonar-instance:
        # On valide le rendu + Nginx, sans lancer la stack docker-in-docker.
        sonarqube_deploy: false
        citools_enable_tls: false
        sonarqube_domain: "sonar.example.com"
verifier:
  name: ansible
