---
# Dossier source du mock applicatif (versionné dans le dépôt, dossier app/).
# Sous site.yml, playbook_dir = ansible/ -> ../app pointe vers la racine du dépôt.
app_source_dir: "{{ playbook_dir }}/../app"
shaka_app_dir: "/opt/shaka-surf"
deploy_user: "deploy"

# Hôte PostgreSQL : IP privée de la VM base de données (injectée par l'inventaire
# Terraform via la variable d'inventaire db_host).
db_host: "127.0.0.1"
postgres_db: "shakasurf"
postgres_app_user: "shaka"

# Démarrer réellement la stack Docker. Mis à false sous Molecule (où l'on valide
# la copie de app/ et le rendu du .env sans docker-in-docker).
app_compose_up: true
