---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml
driver:
  name: docker
platforms:
  - name: app-instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: /usr/sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
  inventory:
    host_vars:
      app-instance:
        # On valide la COPIE de app/ et le RENDU du .env sans démarrer la
        # stack : pas de docker-in-docker dans l'instance Molecule.
        app_compose_up: false
        # Dossier app/ du dépôt, résolu depuis le dossier du rôle
        # (MOLECULE_PROJECT_DIRECTORY = ansible/roles/app).
        app_source_dir: "${MOLECULE_PROJECT_DIRECTORY}/../../../app"
        db_host: "10.20.0.50"
        vault_postgres_password: "molecule-pw"
verifier:
  name: ansible
