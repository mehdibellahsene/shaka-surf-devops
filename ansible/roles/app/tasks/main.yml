---
- name: Créer le dossier applicatif
  ansible.builtin.file:
    path: "{{ shaka_app_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Copier l'application mock (dossier app/ du dépôt) vers la VM
  ansible.builtin.copy:
    src: "{{ app_source_dir }}/"
    dest: "{{ shaka_app_dir }}/"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
  notify: Recreate compose stack

- name: Déposer le fichier d'environnement (.env) depuis le Vault
  ansible.builtin.template:
    src: env.j2
    dest: "{{ shaka_app_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  notify: Recreate compose stack

- name: Valider la syntaxe du fichier compose
  ansible.builtin.command:
    cmd: docker compose config --quiet
    chdir: "{{ shaka_app_dir }}"
  changed_when: false
  when: app_compose_up | bool

- name: Démarrer la stack applicative
  community.docker.docker_compose_v2:
    project_src: "{{ shaka_app_dir }}"
    state: present
    build: always
  when: app_compose_up | bool
