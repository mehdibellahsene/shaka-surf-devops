---
- name: Mettre à jour le cache APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les paquets de base
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - ufw
      - fail2ban
      - python3
      - python3-pip
      - unattended-upgrades
    state: present

- name: Créer l'utilisateur de déploiement
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    state: present

- name: Durcissement SSH (désactiver login root et mots de passe)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: "sshd -t -f %s"
  loop:
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
  notify: Restart sshd

- name: Activer fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# ---- Docker (sauf si désactivé, ex. nœud de contrôle) ----
- name: Installer la clé GPG officielle de Docker
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  when: install_docker | bool

- name: Ajouter le dépôt Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  when: install_docker | bool

- name: Installer Docker Engine et le plugin compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true
  when: install_docker | bool

- name: Démarrer et activer Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: install_docker | bool

- name: Ajouter l'utilisateur de déploiement au groupe docker
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
  when: install_docker | bool
