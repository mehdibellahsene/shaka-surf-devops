---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: jenkins-instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: /usr/sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
  inventory:
    host_vars:
      jenkins-instance:
        citools_enable_tls: false
        jenkins_domain: "jenkins.example.com"
        # On valide l'installation + la config sans booter la JVM Jenkins
        # (trop lourde pour un conteneur de test, comme sonarqube/nexus).
        jenkins_start_service: false
verifier:
  name: ansible
