---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Nginx est actif
      ansible.builtin.service:
        name: nginx
        state: started
      check_mode: true
      register: ng
      failed_when: ng is failed

    - name: Le port 80 est en écoute
      ansible.builtin.wait_for:
        port: 80
        host: 127.0.0.1
        timeout: 10

    - name: La configuration Nginx est valide
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Le vhost définit les upstreams applicatifs
      ansible.builtin.command: grep -q '10.20.0.11:80' /etc/nginx/sites-available/shaka.conf
      changed_when: false
