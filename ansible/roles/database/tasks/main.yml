---
- name: Installer les prérequis APT
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - acl
      - python3-psycopg2
    state: present
    update_cache: true

- name: Ajouter la clé GPG du dépôt PostgreSQL (PGDG)
  ansible.builtin.apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Ajouter le dépôt PGDG
  ansible.builtin.apt_repository:
    repo: "deb https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present

- name: Installer PostgreSQL {{ postgres_version }}
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-client-{{ postgres_version }}"
    state: present
    update_cache: true

- name: Écouter sur toutes les interfaces (accès restreint par pg_hba + SG)
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
    regexp: "^#?listen_addresses"
    line: "listen_addresses = '*'"
  notify: Restart postgresql

- name: Configurer pg_hba.conf (accès restreint au réseau applicatif)
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Restart postgresql

- name: Démarrer et activer PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

# Mot de passe distinct de celui de l'utilisateur applicatif : les VMs App
# ne reçoivent jamais les droits superutilisateur.
- name: Définir le mot de passe du superutilisateur postgres
  community.postgresql.postgresql_user:
    name: postgres
    password: "{{ vault_postgres_admin_password }}"
  become: true
  become_user: postgres

- name: Créer l'utilisateur applicatif {{ postgres_app_user }}
  community.postgresql.postgresql_user:
    name: "{{ postgres_app_user }}"
    password: "{{ vault_postgres_password }}"
  become: true
  become_user: postgres

- name: Créer la base {{ postgres_db }} (propriétaire {{ postgres_app_user }})
  community.postgresql.postgresql_db:
    name: "{{ postgres_db }}"
    owner: "{{ postgres_app_user }}"
    state: present
  become: true
  become_user: postgres

- name: Copier le script d'init SQL du mock sur la VM
  ansible.builtin.copy:
    src: "{{ database_init_sql }}"
    dest: "{{ database_init_sql_dest }}"
    owner: postgres
    group: postgres
    mode: "0644"

- name: Garde-fou d'idempotence — marqueur d'init déjà appliquée
  ansible.builtin.stat:
    path: /var/lib/postgresql/.shaka_init_done
  register: init_marker

# Appliqué en tant qu'utilisateur applicatif (via 127.0.0.1) : les tables
# lessons/enrollments appartiennent ainsi à {{ postgres_app_user }}, pas au superutilisateur.
- name: Appliquer le script d'init (tables lessons/enrollments + seed, SQL idempotent)
  community.postgresql.postgresql_script:
    db: "{{ postgres_db }}"
    path: "{{ database_init_sql_dest }}"
    login_host: 127.0.0.1
    login_user: "{{ postgres_app_user }}"
    login_password: "{{ vault_postgres_password }}"
  when: not init_marker.stat.exists

- name: Poser le marqueur d'init
  ansible.builtin.file:
    path: /var/lib/postgresql/.shaka_init_done
    state: touch
    owner: postgres
    group: postgres
    mode: "0644"
  when: not init_marker.stat.exists
