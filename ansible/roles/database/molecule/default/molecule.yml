---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml
driver:
  name: docker
platforms:
  - name: db-instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: /usr/sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
  inventory:
    host_vars:
      db-instance:
        vault_postgres_password: "molecule-test-pw"
        vault_postgres_admin_password: "molecule-admin-pw"
        db_allowed_cidr: "172.16.0.0/12"
        # Sous Molecule, playbook_dir pointe vers le scénario : on résout le
        # script d'init du mock depuis la racine du dépôt.
        database_init_sql: "${MOLECULE_PROJECT_DIRECTORY}/../../../app/db/init.sql"
verifier:
  name: ansible
