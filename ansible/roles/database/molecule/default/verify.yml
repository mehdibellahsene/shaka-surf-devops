---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: PostgreSQL est actif
      ansible.builtin.service:
        name: postgresql
        state: started
      check_mode: true
      register: pg
      failed_when: pg is failed

    - name: Le port 5432 est en écoute
      ansible.builtin.wait_for:
        port: 5432
        host: 127.0.0.1
        timeout: 10

    - name: Le seed du mock est appliqué (au moins un cours, via l'utilisateur applicatif)
      community.postgresql.postgresql_query:
        db: shakasurf
        login_host: 127.0.0.1
        login_user: shaka
        login_password: "{{ vault_postgres_password }}"
        query: "SELECT count(*) AS nb FROM lessons;"
      register: lessons_check
      failed_when: (lessons_check.query_result[0].nb | int) < 1
