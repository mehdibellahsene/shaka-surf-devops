---
# Playbook principal : configure toute l'infrastructure.
# Inventaire généré par Terraform (ansible/inventory/hosts.ini).
# Secrets chargés automatiquement depuis group_vars/all/vault.yml (chiffré).

# --- Base système partout ---
- name: Base commune (paquets, Docker, durcissement)
  hosts: all
  become: true
  roles:
    - common

# --- Base de données + backups ---
- name: Base de données et sauvegardes
  hosts: db
  become: true
  roles:
    - database
    - backup

# --- Applications ---
- name: Déploiement applicatif
  hosts: app
  become: true
  roles:
    - app

# --- Load balancer (après les apps : il a besoin de leurs upstreams) ---
- name: Load balancer
  hosts: loadbalancer
  become: true
  roles:
    - loadbalancer

# --- Usine logicielle (bonus) ---
- name: Usine logicielle
  hosts: citools
  become: true
  vars:
    citools_ip_dash: "{{ ansible_host | replace('.', '-') }}"
    jenkins_domain: "jenkins-{{ ansible_host | replace('.', '-') }}.sslip.io"
    sonarqube_domain: "sonar-{{ ansible_host | replace('.', '-') }}.sslip.io"
    nexus_domain: "nexus-{{ ansible_host | replace('.', '-') }}.sslip.io"
  roles:
    - jenkins
    - sonarqube
    - nexus
