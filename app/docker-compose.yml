# Compose d'UNE VM applicative — déployé par le rôle Ansible `app`.
# Pas de service `db` ici : PostgreSQL tourne sur la VM base de données
# dédiée ; DB_HOST est fourni par le .env templaté par Ansible.
# Les valeurs par défaut (${VAR:-...}) permettent aussi un lancement à la
# main sans .env, pour tester ce dossier seul.

services:
  web:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      API_HOST: api
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-shakasurf}
      DB_USER: ${DB_USER:-shaka}
      DB_PASSWORD: ${DB_PASSWORD:-shaka} # défaut du mock standalone — écrasé par le .env Ansible (Vault)
      INSTANCE_NAME: ${INSTANCE_NAME:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9940/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
